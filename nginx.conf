server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. The backend serves HTTPS with a self-signed cert, so
    # verification is disabled. The /api prefix is stripped to mirror the Vite dev proxy.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://backend:8080;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        # The backend rate-limits per client address and reads it from this header. Set, not
        # appended: `proxy_add_x_forwarded_for` would keep whatever the client sent in front,
        # letting anyone claim a fresh address per request and slip the limiter entirely.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
