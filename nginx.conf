# Only WebSocket requests should carry `Connection: upgrade`; everything else gets `close`.
# Forwarding the header unconditionally sends an upgrade intent upstream on every request,
# which is at best meaningless and at worst a request-smuggling oddity. Production nginx
# already does this (iac/scripts/provision.sh); this keeps the container in line.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Don't advertise the exact nginx version in every response and error page.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. The /api prefix is stripped to mirror the Vite dev proxy.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass https://backend:8080;
        # The backend generates its own TLS certificate at startup unless WIAB_TLS_CERT/KEY are
        # set, so there is nothing for nginx to verify against. Closing this properly means
        # giving both sides a certificate they agree on, which is a deployment change, not a
        # config one — tracked as L8 in the security review. In production this hop is
        # 127.0.0.1; here it is container-to-container on a private compose network.
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        # The backend rate-limits per client address and reads it from this header. Set, not
        # appended: `proxy_add_x_forwarded_for` would keep whatever the client sent in front,
        # letting anyone claim a fresh address per request and slip the limiter entirely.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
